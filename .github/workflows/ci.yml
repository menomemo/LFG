name: CI

# Runs exactly the four checks `npm run check` runs locally, in the same order,
# so a green local run means a green pipeline. If these ever diverge, the local
# command is the one to fix.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint commit messages in this pull request
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  database:
    name: Row-level security isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Start Supabase
        run: npx supabase start

      # `status -o env` emits API_URL="..." / ANON_KEY="..."; the suite reads
      # SUPABASE_URL and SUPABASE_ANON_KEY, and GITHUB_ENV takes values
      # unquoted. Both are translated here rather than in the test.
      - name: Export connection settings
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      # SECURITY.md calls this test required rather than optional. It runs on a
      # real database because a policy that is only unit-tested is a policy
      # nobody has seen refuse anything.
      - name: Isolation suite
        run: npm run test:db

      - name: Fail if the committed types drifted from the migrations
        run: |
          npm run db:types
          git diff --exit-code supabase/database.types.ts

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

  translations:
    name: README translation drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The two READMEs drifted once: the English one gained the walking
      # skeleton's setup steps and the Chinese one kept saying there was
      # nothing to look at. Structure matched -- same headings, same tables,
      # same links -- so only reading them caught it. This catches the cause
      # instead: one changing without the other.
      - name: README.zh-CN.md must change with README.md
        run: |
          changed=$(git diff --name-only \
            '${{ github.event.pull_request.base.sha }}' \
            '${{ github.event.pull_request.head.sha }}')
          en=$(printf '%s\n' "$changed" | grep -cx 'README.md' || true)
          zh=$(printf '%s\n' "$changed" | grep -cx 'README.zh-CN.md' || true)
          if [ "$en" -gt 0 ] && [ "$zh" -eq 0 ]; then
            echo "::error file=README.zh-CN.md::README.md changed but its translation did not. Update README.zh-CN.md in this pull request, or say in the description why it does not need updating."
            exit 1
          fi
          echo "ok: en=$en zh=$zh"
